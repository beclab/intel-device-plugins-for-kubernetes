apiVersion: v1
kind: ServiceAccount
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: intel-gpu-plugin-node-register
  labels:
    app: intel-gpu-plugin
rules:
# Needed to publish the per-node bytetrade.io/node-intel-register annotation
# describing each Intel GPU card's uuid/kind/card/driver.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: intel-gpu-plugin-node-register
  labels:
    app: intel-gpu-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: intel-gpu-plugin-node-register
subjects:
- kind: ServiceAccount
  name: intel-gpu-plugin
  namespace: kube-system
