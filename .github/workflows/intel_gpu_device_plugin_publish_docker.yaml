name: Publish intel-gpu-device-plugin to Dockerhub

on:
    workflow_dispatch:
      inputs:
        tags:
          description: 'Release Tags'
        vxpu_builder_tag:
          description: 'beclab/vxpu_builder tag that provides libvxpu.so'
          required: true

jobs:
  publish_dockerhub_amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - name: Build and push amd64 Docker image
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: beclab/intel-device-plugin:${{ github.event.inputs.tags }}
          file: build/docker/intel-gpu-plugin.Dockerfile
          build-args: |
            VXPU_BUILDER=beclab/vxpu_builder:${{ github.event.inputs.vxpu_builder_tag }}
          platforms: linux/amd64
